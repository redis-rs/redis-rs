name: PR 2305 move regression test

on:
  push:
    branches:
      - fix-bug-1

permissions:
  contents: write

jobs:
  move-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-bug-1
          fetch-depth: 0

      - name: Move regression into cluster async suite
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path("redis/tests/regression_async_asking_error.rs")
          dst = Path("redis/tests/test_cluster_async.rs")

          source = src.read_text()
          test = source[source.index("#[test]"):].rstrip() + "\n"
          test = "\n".join(("    " + line) if line else "" for line in test.splitlines()) + "\n"

          marker = "    #[test]\n    fn test_async_cluster_ask_save_new_connection() {"
          target = dst.read_text()

          assert marker in target, "ASK test insertion marker not found"
          assert "fn async_ask_redirect_propagates_asking_failure()" not in target, "test already present"

          dst.write_text(target.replace(marker, test + "\n" + marker, 1))
          src.unlink()
          PY

      - name: Format and test
        shell: bash
        run: |
          rustup toolchain install nightly --component rustfmt --profile minimal --no-self-update
          cargo +nightly fmt --all
          cargo test -p redis --features cluster-async,tokio-comp --test test_cluster_async async_ask_redirect_propagates_asking_failure
          git diff --check

      - name: Verify scope and commit
        shell: bash
        run: |
          rm -f .github/workflows/pr2305-move-test.yml

          unexpected=$(git status --short | awk '{print $2}' | grep -Ev '^(redis/tests/test_cluster_async.rs|redis/tests/regression_async_asking_error.rs|\.github/workflows/pr2305-move-test.yml)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: move ASKING regression into cluster async suite"
          git push origin HEAD:fix-bug-1
