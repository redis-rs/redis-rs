name: "Build and lint"
inputs:
  rust-toolchain:
    type: string,
    required: true

runs:
  using: "composite"
  steps:
    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        # Skip target/ caching only for nightly, whose compiler changes daily
        # and therefore produces a new cache key every day. Stable, beta, and
        # 1.88.0 still cache target/ as before.
        cache-targets: ${{ inputs.rust-toolchain != 'nightly' }}

    - name: Build default
      shell: bash
      run: make build

    - name: Build all features
      shell: bash
      run: RUSTFLAGS="-D warnings" cargo build --locked -p redis --all-features

    - name: Lint
      shell: bash
      run: make lint

    - name: Check runtimes
      shell: bash
      run: |
        # Remove dev-dependencies so they do not enable features accidentally
        # https://github.com/rust-lang/cargo/issues/4664
        sed -i '/dev-dependencies/,/dev-dependencies/d' Cargo.toml
        cargo check -p redis --no-default-features --features tokio-comp
        cargo check -p redis --no-default-features --features smol-comp
        # A runtime without TLS support, next to TLS enabled for the other runtime
        cargo check -p redis --no-default-features --features tokio-comp,smol-rustls-comp,tls-rustls-webpki-roots
        cargo check -p redis --no-default-features --features smol-comp,tokio-rustls-comp,tls-rustls-webpki-roots
