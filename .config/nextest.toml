# `NEXTEST_TEST_GLOBAL_SLOT`, which redis-test uses to give concurrently running tests
# disjoint ports, needs 0.9.90. Older versions fall back to racy random ports.
nextest-version = { recommended = "0.9.90" }

[profile.default]
retries = 2
failure-output = "immediate-final" # show test failures inline, and also at the end of the run
fail-fast = false # run all tests, even if some failed
slow-timeout = { period = "3s", terminate-after = 7 }
status-level = "skip"


[[profile.default.overrides]]
filter = 'test(cluster_async::test_async_cluster_basic_failover)'
slow-timeout = { period = "20s", terminate-after = 2 }


[profile.tcp_tls]
default-filter = 'not (test(test_module))'

[profile.tcp]
default-filter = 'not (test(tls) | test(test_module))'

[profile.unix]
default-filter = 'not (test(cluster) | binary(test_sentinel) | test(tls) | test(test_module))'

[profile.module_bloom]
default-filter = 'binary(test_module_bloom*)'

[profile.module_json]
default-filter = 'test(test_module_json)'

[profile.module_search]
default-filter = 'binary(test_module_search*)'
