[package]
name = "redis-test"
version = "2.0.0-rc.1"
edition = "2024"
description = "Testing helpers for the `redis` crate"
repository = "https://github.com/redis-rs/redis-rs"
documentation = "https://docs.rs/redis-test"
license = "BSD-3-Clause"
rust-version = "1.88"

[lib]
bench = false

[dependencies]
redis = { version = "2.0.0-rc.1", path = "../redis", default-features = false }
bytes = { version = "1", optional = true }
futures = { version = "0.3", optional = true }
tempfile = "3.27.0"
socket2 = "0.6"
rand = "0.10"
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring"] }

[features]
aio = ["futures", "redis/aio", "redis/tokio-comp"]
tls-rustls = ["dep:rustls", "rustls/std", "redis/tls-rustls"]
tls-rustls-insecure = ["redis/tls-rustls-insecure", "tls-rustls"]
tokio-rustls-comp = ["redis/tokio-rustls-comp"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
