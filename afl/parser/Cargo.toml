[package]
name = "fuzz-target-parser"
version = "0.1.0"
authors = ["redis-rs developers"]
edition = "2024"

[[bin]]
name = "fuzz-target"
path = "src/main.rs"

[[bin]]
name = "fuzz-codec"
path = "src/codec.rs"

[[bin]]
name = "reproduce"
path = "src/reproduce.rs"

[dependencies]
afl = "0.18"
bytes = "1"
redis = { path = "../../redis", features = ["tokio-comp"] }
tokio-util = { version = "0.7.5", features = ["codec"] }

[lints]
workspace = true
